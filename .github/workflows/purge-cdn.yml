name: Purge jsDelivr CDN

on:
  push:
    branches: [main]
    paths:
      - 'watch/**/*.js'
      - 'watch/**/*.json'
      - 'repo.json'
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge jsDelivr cache for extension files
        run: |
          BASE="https://purge.jsdelivr.net/gh/${{ github.repository }}@main"
          for FILE in \
            "watch/index.json" \
            "watch/fr/frenchstream.js" \
            "watch/en/gotvseries.js" \
            "repo.json"; do
            echo "Purging: $FILE"
            curl -sf "${BASE}/${FILE}" -o /dev/null \
              && echo "  ok: ${FILE}" \
              || echo "  failed: ${FILE}"
          done
