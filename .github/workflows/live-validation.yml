name: Live Extension Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tools/**"
      - "ui-layouts/**"
      - ".github/workflows/live-validation.yml"
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

jobs:
  live:
    name: Catalog, pagination and media smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run live checks for every extension
        run: |
          files="$(find src -type f -name '*.js' ! -name '*.min.js' ! -name 'server.js' -print | sort | paste -sd, -)"
          test -n "$files"
          echo "Testing $(printf '%s' "$files" | tr ',' '\n' | wc -l) extensions across all source categories, including NSFW"
          node tools/run_all_tests.mjs \
            --files "$files" \
            --deep \
            --strict \
            --concurrency 10 \
            --out tools/live-report.json

      - name: Upload live report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-extension-report
          path: tools/live-report.json