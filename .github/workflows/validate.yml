name: Extension Validation

on:
  push:
    branches: [ main, 'agent/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate extensions
        run: npm run validate
      - name: Test Eporner parser
        run: npm run test:eporner
      - name: Test IMHentai parser
        run: npm run test:imhentai
      - name: Test AllManga request wrapper
        run: npm run test:allmanga