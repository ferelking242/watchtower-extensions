name: Build & Release Plugins

on:
  push:
    branches: [main]
    paths:
      - 'plugins/*.smplug'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Validate & Release .smplug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate .smplug archives
        run: |
          set -e
          FAILED=0
          FOUND=0
          for f in plugins/*.smplug; do
            [ -f "$f" ] || { echo "No .smplug files found in plugins/"; exit 0; }
            FOUND=$((FOUND+1))
            echo "→ Checking: $f"
            if ! unzip -t "$f" > /dev/null 2>&1; then
              echo "  ❌ Not a valid ZIP: $f"
              FAILED=1
              continue
            fi
            if ! unzip -l "$f" | grep -q "plugin.json"; then
              echo "  ❌ Missing plugin.json: $f"
              FAILED=1
              continue
            fi
            NAME=$(unzip -p "$f" plugin.json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('name','?'))" 2>/dev/null || echo "?")
            echo "  ✅ Valid — name: $NAME"
          done
          echo "---"
          echo "Checked $FOUND file(s). Failed: $FAILED"
          [ $FAILED -eq 0 ] || exit 1

      - name: Delete existing 'plugins-latest' release & tag
        run: |
          gh release delete plugins-latest --cleanup-tag --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release with all .smplug assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: plugins-latest
          name: "Latest Plugins"
          body: |
            Auto-generated release — latest build of all Watchtower music plugins.

            | Plugin | Direct download |
            |--------|----------------|
            | Spotify | [spotify.smplug](https://github.com/${{ github.repository }}/releases/download/plugins-latest/spotify.smplug) |
            | Deezer | [deezer.smplug](https://github.com/${{ github.repository }}/releases/download/plugins-latest/deezer.smplug) |
            | Apple Music | [applemusic.smplug](https://github.com/${{ github.repository }}/releases/download/plugins-latest/applemusic.smplug) |
            | YouTube Music | [youtubemusic.smplug](https://github.com/${{ github.repository }}/releases/download/plugins-latest/youtubemusic.smplug) |
            | FLAC Music | [flac.smplug](https://github.com/${{ github.repository }}/releases/download/plugins-latest/flac.smplug) |
            | MusicBrainz | [musicbrainz.smplug](https://github.com/${{ github.repository }}/releases/download/plugins-latest/musicbrainz.smplug) |

            > **Note:** The `upstream` URLs in `index/music.json` use `raw.githubusercontent.com` for direct, rate-limit-free downloads. Release assets are provided as an alternative distribution channel.
          prerelease: false
          make_latest: true
          files: plugins/*.smplug
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Purge jsDelivr CDN for plugin index
        run: |
          BASE="https://purge.jsdelivr.net/gh/${{ github.repository }}@main"
          curl -sf "${BASE}/index/music.json" -o /dev/null && echo "Purged: index/music.json" || echo "Purge failed (non-fatal)"
