name: Watchtower Runtime Validation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: CLI test depth
        required: true
        default: deep
        type: choice
        options:
          - load
          - smoke
          - deep
  push:
    branches: [main]
    paths:
      - "src/**"
      - "index/**"
      - ".github/workflows/watchtower-runtime-validation.yml"

permissions:
  contents: read

jobs:
  linux:
    name: Test extensions with Watchtower Linux headless release
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      TEST_MODE: ${{ inputs.mode || 'deep' }}
      WATCHTOWER_RELEASE_TAG: linux-headless-latest
      WATCHTOWER_RELEASE_ASSET: watchtower-linux-x64-headless.7z
    steps:
      - name: Checkout extensions
        uses: actions/checkout@v4
        with:
          path: watchtower-extensions

      - name: Install Linux runtime dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libunwind-dev \
            libgtk-3-dev libwebkit2gtk-4.0-dev libwpewebkit-1.0-dev \
            libwpebackend-fdo-1.0-dev libsoup-3.0-dev liblzma-dev \
            libblkid-dev libmount-dev libglib2.0-dev libdbus-1-dev \
            libnotify-dev libayatana-appindicator3-dev libsecret-1-dev \
            libjsoncpp-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            libasound2-dev libpulse-dev libxcb-xfixes0-dev \
            libepoxy-dev libmpv-dev mpv p7zip-full xvfb

      - name: Download Watchtower Linux headless release
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/watchtower"
          gh release download "$WATCHTOWER_RELEASE_TAG" \
            --repo ferelking242/watchtower \
            --pattern "$WATCHTOWER_RELEASE_ASSET" \
            --dir "$RUNNER_TEMP/watchtower"
          7z x -y \
            "$RUNNER_TEMP/watchtower/$WATCHTOWER_RELEASE_ASSET" \
            "-o$RUNNER_TEMP/watchtower/bundle" \
            >/dev/null
          WATCHTOWER_BIN="$(find "$RUNNER_TEMP/watchtower/bundle" \
            -type f -name watchtower -print -quit)"
          test -n "$WATCHTOWER_BIN"
          test -x "$WATCHTOWER_BIN"
          echo "WATCHTOWER_BIN=$WATCHTOWER_BIN" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/watchtower/bundle/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run Watchtower CLI against every local extension
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ci-reports"
          echo "Watchtower runtime scope:"
          find "$GITHUB_WORKSPACE/watchtower-extensions/src" \
            -type f -name '*.js' ! -name '*.min.js' ! -name 'server.js' | sort
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            "$WATCHTOWER_BIN" --cli doctor
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            "$WATCHTOWER_BIN" --cli extensions test \
            --repo "$GITHUB_WORKSPACE/watchtower-extensions" \
            --mode "$TEST_MODE" \
            --concurrency 4 \
            --timeout 45 \
            --report "$GITHUB_WORKSPACE/ci-reports/extensions.json"

      - name: Upload Watchtower runtime report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchtower-runtime-extension-report
          path: ci-reports/extensions.json